name: Build framegen mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S examples/framegen-mod -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Package .levipack
        run: |
          mkdir -p dist/framegen-mod
          cp build/out/arm64-v8a/libframegen_mod.so dist/framegen-mod/
          sed 's/libfull_cpp_mod.so/libframegen_mod.so/g' \
            examples/full-cpp-mod/manifest.json > dist/framegen-mod/manifest.json
          cd dist/framegen-mod
          zip -r ../framegen-mod.levipack manifest.json libframegen_mod.so
          cd ..
          unzip -l framegen-mod.levipack

      - uses: actions/upload-artifact@v4
        with:
          name: framegen-mod
          path: dist/framegen-mod
